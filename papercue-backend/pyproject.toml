[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "papercue-backend"
version = "0.1.0"
description = "Local-only research prototype backend for PaperCue: speaker-side presenter cues grounded in a paper and an evolving audience model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Research prototype - internal use" }
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Real local embeddings. Pulls in PyTorch; not needed for mock mode or tests.
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
papercue-server = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.db" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]
